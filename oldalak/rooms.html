<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Válassz Chatszobát</title>
    <link rel="stylesheet" href="../css/Szabi.css">
</head>
<body>
    <div class="room-container">
        <h2>Válassz egy chatszobát!</h2>
        <button onclick="enterRoom('Általános')">Általános</button>
        <button onclick="enterRoom('Gladiátor')">Gladiátor</button> 
        <button onclick="enterRoom('játék')">Játék</button>
    </div>

    <script>
        function enterRoom(room) {
            document.cookie = `chatszoba=${room}; path=/`;
            window.location.href = "/szoba";
        }
    </script>
</body>
</html>
