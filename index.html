<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatszoba</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

    <!-- Bejelentkezés -->
    <div id="login-section" class="login-container">
        <h2>Adja meg a nevét</h2>
        <input type="text" id="username" placeholder="Felhasználónév" required>
        <button onclick="showRoomSelection()">Tovább</button>
    </div>

    <!-- Szobaválasztás -->
    <div id="room-selection" class="room-container" style="display: none;">
        <h2>Válassz egy chatszobát!</h2>
        <button onclick="joinChat('Általános')">Általános</button>
        <button onclick="joinChat('Gladiátor')">Gladiátor</button> 
        <button onclick="joinChat('Játék')">Játék</button>
    </div>

    <!-- Chatszoba -->
    <div id="chat-section" class="chat-container" style="display: none;">
        <h2>Üdvözlünk a chatszobában!</h2>
        <button id="dark-mode-toggle">🌙 Sötét mód</button>
        <div id="chatbox"></div>
        <div id="typing-indicator"></div>
        <div class="input-container">
            <input type="text" id="message" placeholder="Írj egy üzenetet..." onkeypress="if(event.keyCode==13) sendMessage();">
            <button onclick="sendMessage()">Küldés</button>
        </div>
    </div>

    <!-- Jobb klikkes menü -->
    <div id="context-menu" class="context-menu">
        <ul>
            <li id="private-message">💬 Privát üzenet küldése</li>
            <li id="report-message">⚠️ Jelentés az adminnak</li>
        </ul>
    </div>

    <!-- JS kezelők -->
    <script>
        function showRoomSelection() {
            const username = document.getElementById("username").value.trim();
            if (username === "") {
                alert("Kérlek, add meg a neved!");
                return;
            }
            sessionStorage.setItem("username", username);
            document.getElementById("login-section").style.display = "none";
            document.getElementById("room-selection").style.display = "block";
        }
    
        function joinChat(room) {
            sessionStorage.setItem("chatroom", room); // Szoba mentése sessionStorage-ba
            document.getElementById("room-selection").style.display = "none";
            document.getElementById("chat-section").style.display = "block";
            // Ide jöhetnek további inicializáló hívások, pl. loadMessages()
        }
    </script>
    

</body>
</html>
