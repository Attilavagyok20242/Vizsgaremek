<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatszoba</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="chat-container">
        <h2>Üdvözlünk a chatszobában!</h2>
        <button id="dark-mode-toggle">🌙 Sötét mód</button>
        <div id="chatbox"></div>
        <div id="typing-indicator"></div>
        <div class="input-container">
            <input type="text" id="message" placeholder="Írj egy üzenetet..." onkeypress="if(event.keyCode==13) sendMessage();">
            <button onclick="sendMessage()">Küldés</button>
        </div>
    </div>
    
    <div id="context-menu" class="context-menu">
        <ul>
            <li id="private-message">💬 Privát üzenet küldése</li>
            <li id="report-message">⚠️ Jelentés az adminnak</li>
        </ul>
    </div>
    <script>
        function joinChat() {
            let username = document.getElementById("username").value;
            let chatroom = document.getElementById("chatroom").value;
        
            if (username.trim() === "") {
                alert("Kérlek, add meg a neved!");
                return;
            }
        
            sessionStorage.setItem("username", username);
            sessionStorage.setItem("chatroom", chatroom);
            window.location.href = "chatszoba.php";
        }
    </script>
</body>
</html>
